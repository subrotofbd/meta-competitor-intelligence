# Alembic configuration.
#
# The database URL is deliberately absent from this file. migrations/env.py
# reads it from app.core.config.Settings, so there is exactly one place that
# knows how to reach the database and no second copy of a password to keep in
# sync with .env.
#
# Common commands (all via `uv run`, from the repository root):
#
#   alembic upgrade head        apply every pending migration
#   alembic current            which revision the database is on
#   alembic heads              which revision the code expects
#   alembic history            full applied chain
#
# Creating a future migration (first needed in S1.1, once models exist):
#
#   1. Add the model under backend/app/db/, and make sure its module is
#      imported from migrations/env.py so autogenerate can see the table.
#   2. uv run alembic revision --autogenerate -m "short description"
#   3. READ the generated file before trusting it. Autogenerate cannot see
#      data migrations, server-default changes, or column renames -- it emits
#      a drop+add pair for a rename, which loses data.
#   4. Confirm the downgrade half is correct and reversible.
#   5. uv run alembic upgrade head
#
# Rollback warning: `alembic downgrade` executes the downgrade() functions,
# which DROP things. Get explicit human approval before running any downgrade.

[alembic]
script_location = database/migrations
prepend_sys_path = backend
# Explicit, so Alembic does not fall back to deprecated legacy path splitting.
# Only one version directory is used, so no path is ever split.
path_separator = os

# No [loggers]/[handlers]/[formatters] sections on purpose. env.py does not call
# logging.config.fileConfig, because that would replace the structured JSON
# handler installed by app.core.logging with Alembic's own console formatter.
# Instead the same structured handler is used, so migrations emit JSON too.
