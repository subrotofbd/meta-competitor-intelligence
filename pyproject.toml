[project]
name = "brandset-meta-competitor-intelligence"
version = "0.1.0"
description = "Competitor ad intelligence for public Meta/Facebook/Instagram advertising data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

# ============================================================
# DEPENDENCY POLICY
#
# S0.1 foundation only. Deliberately minimal.
#
# EXCLUDED ON PURPOSE -- do not add without a checkpoint decision:
#   redis, celery              -> queue must stay replaceable; Postgres
#                                 job queue is behind a JobQueue Protocol
#   ffmpeg / video libs        -> video scene analysis + transcription
#                                 are deferred phases
#   scraping / browser auto    -> data-access rules forbid fingerprint
#   (playwright, selenium,        impersonation, lsd mining, and
#    curl_cffi, tls-client)       reverse-engineered internal GraphQL
#   openai / google-genai SDKs -> AIProvider interface only; no SDK
#   elasticsearch              -> search is PostgreSQL tsvector + pg_trgm
#
# Structured logging uses the Python stdlib (logging + a JSON
# formatter) -- no extra dependency.
# ============================================================
dependencies = [
    "fastapi>=0.115,<1.0",              # API framework
    "uvicorn[standard]>=0.32,<1.0",     # ASGI dev server
    "sqlalchemy[asyncio]>=2.0.36,<2.1", # ORM, SQLAlchemy 2 style
    "alembic>=1.14,<2.0",               # migrations
    "pydantic>=2.9,<3.0",               # validation
    "pydantic-settings>=2.6,<3.0",      # settings from env / .env
    "psycopg[binary]>=3.2,<4.0",        # psycopg3 -- NOT psycopg2
]

# Dev dependencies live ONLY here (PEP 735). uv installs the `dev`
# group by default with a plain `uv sync`, so there is no `--extra`
# flag to remember and no second list to drift out of sync.
[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    # Integration tests spin up a throwaway Postgres. Requires the
    # Docker daemon to be running. First used in S1.1.
    "testcontainers[postgres]>=4.9,<5.0",
]

# ============================================================
# uv
# ============================================================
[tool.uv]
package = true

# ============================================================
# Build backend
# backend/app is exposed as the top-level `app` package, so
# `uvicorn app.main:app` and `from app.core...` work from anywhere.
# ============================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

# ============================================================
# Ruff -- lint + format
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]
# Never let the formatter touch the protected project documents.
# Ruff >=0.16 formats Python code blocks inside Markdown, which would
# silently rewrite ARCHITECTURE.md, AGENTS.md and friends. Those files
# are governance records and must only change by deliberate checkpoint edit.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ASYNC",
    "S",    # bandit -- security (secrets, injection)
    "B",    # bugbear
    "C4",   # comprehensions
    "DTZ",  # naive datetimes
    "T20",  # print statements
    "RUF",
]
ignore = [
    "S101",  # assert -- allowed in tests
]

[tool.ruff.lint.per-file-ignores]
# Patterns are matched against the path from the project root, so these need
# the `**/` prefix to reach backend/. Plain "tests/**" never matched anything.
"**/tests/**" = ["S", "T20"]
"**/__init__.py" = ["F401"]
# Provider error names are fixed by ARCHITECTURE.md and the S0.3 contract:
# RateLimited, Blocked, SchemaChanged, Transient. They are written into run
# records and read by operators, so they are not renamed to satisfy a lint
# rule. A new exception outside these modules still needs an Error suffix.
# S3.1's AI errors deliberately reuse the same vocabulary -- RateLimited and
# Blocked mean the same thing to the same operator -- and `error_type` in
# `ai_jobs` stores these names verbatim.
"**/app/providers/data/errors.py" = ["N818"]
"**/app/providers/ai/errors.py" = ["N818"]
# `CsvExportTooLarge` is caught by name in `api/ads.py` to build a 413, and the
# name says what happened rather than where it happened. Renaming it to
# `...Error` would say less about the condition than the name does.
"**/app/services/ad_csv.py" = ["N818"]
"**/app/services/jobs.py" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ============================================================
# mypy
# ============================================================
[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["app"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
# `backend` puts the `app` package on the path. `backend/tests` puts the shared
# test helpers (`_ast_probe`) on it too -- pytest guarantees the path for the
# package under test, not for a helper module sitting beside the tests.
pythonpath = ["backend", "backend/tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: fast, isolated tests",
    "contract: provider contract tests against sanitized fixtures",
    "integration: tests requiring a real Postgres",
    "smoke: real-data smoke tests -- require explicit human approval",
]
